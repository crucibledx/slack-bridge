# Slack app for the bridge. Create it at https://api.slack.com/apps > Create New App > From a manifest.
# Replace <subdomain> with the Cloudflare account's workers.dev subdomain.
display_information:
  name: Tundish
  description: Sends messages in the bridged channels to the Crucible workstreams.
features:
  bot_user:
    display_name: Tundish
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
      - chat:write
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    request_url: https://tundish.<subdomain>.workers.dev/slack/events
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
